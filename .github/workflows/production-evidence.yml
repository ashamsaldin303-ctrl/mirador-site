# MIRADOR — production-evidence battery (prompt-3 Q1–Q4 · the sanctioned surface)
# Manually re-triggerable: workflow_dispatch only (REPLAY.md documents it).
# Never triggers on push — the evidence commit it makes must not loop the run.
# Produces the prod-run evidence families under /evidence/ (surface-labeled;
# the round-2 dev-run set is never touched) and pushes them to main.
name: production-evidence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-evidence
  cancel-in-progress: false

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16 # major pin — recorded in MANIFEST.md + docs/versions.md [pin-at-build]
        env:
          POSTGRES_USER: mirador
          POSTGRES_PASSWORD: mirador
          POSTGRES_DB: mirador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirador"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mirador:mirador@localhost:5432/mirador
      # PLACEHOLDER policy (prompt-4 §9 / R0): canonical/hreflang/OG/JSON-LD render
      # against this origin — never claimed deployed; swap = one env var at deployment.
      NEXT_PUBLIC_SITE_URL: https://mirador.example
      EVIDENCE_BASE_URL: http://localhost:3000
      EVIDENCE_SURFACE: prod-run

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (no DB needed)
        run: bun run db:generate

      - name: Install Playwright chromium (+ system deps)
        run: |
          set -eo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ripgrep
          rg --version
          bunx playwright install --with-deps chromium

      - name: "Q1: canonical migrate + seed + counts → evidence/prod-run/specs/seed-count.log"
        run: |
          set -eo pipefail
          bun run migrate
          bun run seed
          bun -e '
          const {PrismaClient} = require("@prisma/client");
          const db = new PrismaClient();
          const sections = await db.menuSection.count();
          const items = await db.menuItem.count();
          const perSection = await db.menuSection.findMany({orderBy:{sortOrder:"asc"},include:{_count:{select:{items:true}}}});
          const gallery = await db.galleryItem.count();
          const reservations = await db.reservation.count();
          const inquiries = await db.inquiry.count();
          const lines = [
            "# seed counts on PostgreSQL — machine-generated " + new Date().toISOString(),
            "# gate (F3-1): 6 sections · 28 dishes (4–5 per section) · 8 gallery · 12 reservations · 0 inquiries",
            "sections=" + sections, "items=" + items,
            ...perSection.map(s => `  ${s.slug}: ${s._count.items} items`),
            "gallery=" + gallery, "reservations=" + reservations, "inquiries=" + inquiries,
            (sections===6 && items===28 && gallery===8 && reservations===12 && inquiries===0 && perSection.every(s=>s._count.items>=4 && s._count.items<=7))
              ? "GATE F3-1: PASS — deterministic seed counts identical to the SQLite baseline"
              : "GATE F3-1: FAIL — counts drifted",
          ];
          require("node:fs").mkdirSync("evidence/prod-run/specs", {recursive:true});
          require("node:fs").writeFileSync("evidence/prod-run/specs/seed-count.log", lines.join("\n") + "\n");
          console.log(lines.join("\n"));
          await db.$disconnect();'

      - name: "Q2-prep: deterministic suite → evidence/prod-run/gates + audits"
        run: |
          set -eo pipefail
          mkdir -p evidence/prod-run/gates evidence/prod-run/audits
          bash scripts/gates.sh 2>&1 | tee evidence/prod-run/gates/deterministic-suite.log
          echo "--- tsc --noEmit (whole repo) ---" >> evidence/prod-run/gates/deterministic-suite.log
          bunx tsc --noEmit 2>&1 | tee -a evidence/prod-run/gates/deterministic-suite.log
          echo "--- eslint . --max-warnings 0 ---" >> evidence/prod-run/gates/deterministic-suite.log
          bunx eslint . --max-warnings 0 2>&1 | tee -a evidence/prod-run/gates/deterministic-suite.log
          echo "--- audits (fonts · tokens · copy) ---" > evidence/prod-run/audits/audits-run.log
          bun run audit:fonts 2>&1 | tee -a evidence/prod-run/audits/audits-run.log
          bun run audit:tokens 2>&1 | tee -a evidence/prod-run/audits/audits-run.log
          bun run audit:copy 2>&1 | tee -a evidence/prod-run/audits/audits-run.log

      - name: "Q1: production build (B1) → build-output.log"
        run: bun run build 2>&1 | tee build-output.log

      - name: "Q1: boot production server + readiness wait"
        run: |
          set -eo pipefail
          nohup bun run start > /dev/null 2>&1 &
          echo "production server booting (standalone, port 3000)…"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 http://localhost:3000/en || echo 000)
            if [ "$code" = "200" ]; then echo "ready after ~$((i*2))s: GET /en → 200"; break; fi
            sleep 2
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 http://localhost:3000/en)
          echo "final readiness: GET /en → $code"
          [ "$code" = "200" ] || { echo "FATAL: production server not ready"; exit 1; }

      - name: "Q2: build budgets (E18/E19) → F12-2/prod-run + F6-3/prod-run"
        run: bun evidence/tools/build-budgets.ts

      - name: "Q2b: R7 fences on the fresh build — LEDGER (E57) + EXCHANGE LEDGER (E58) + GATEBOOK (E59)"
        run: |
          set -eo pipefail
          # P-041: full wire assert against THIS run's fresh tables
          bun scripts/ledger.ts
          # P-043: regenerate the exchange ledger from this run's raw files
          bun scripts/exchange-ledger.ts
          # P-044: the gatebook drift guard (also armed in ci.yml)
          bun scripts/verify-gatebook.ts

      - name: "Q2c: R10 idiom audit (E66) — Button API A1–A12 on the tree as built"
        run: |
          set -eo pipefail
          bun scripts/audit-idioms.ts

      - name: "Q3: HTTP semantics (E22) → evidence/prod-run/http/"
        run: |
          set -eo pipefail
          mkdir -p evidence/prod-run/http
          cd evidence/prod-run/http
          curl -is -m 20 "http://localhost:3000/en" > en--200.txt
          curl -is -m 20 "http://localhost:3000/ar" > ar--200.txt
          curl -is -m 20 "http://localhost:3000/en/nonexistent-page" > en-nonexistent.txt
          curl -is -m 20 "http://localhost:3000/ar/nonexistent-page" > ar-nonexistent.txt
          cd ../../..
          bun evidence/tools/http-404-grep.ts

      - name: "Q4a: capacity-race FIRST — on PostgreSQL (E21)"
        run: bun evidence/tools/api-specs.ts capacity-race

      - name: "Q4b: the remaining 8 E2E specs (E23)"
        run: |
          bun evidence/tools/api-specs.ts capacity-sequential ratelimit dupguard honeypot sec-r5
          bun evidence/tools/browser-specs.ts locale-atomic webgl-kill sheet-z booking inquiry

      - name: "Q4b2: F3-5 filter pair re-shoot + JRN-1 auto-kill emulation (E50/E55)"
        run: |
          bun evidence/tools/filter-pair.ts
          bun evidence/tools/journey-emulation.ts

      - name: "Q4b4: the readers suite (E75) — Hands/Ears/Calm ×4 routes ×2 locales"
        run: bun evidence/tools/readers.ts

      - name: "Q4b6: the route announcer + handrail (E70) — soft-nav speaks"
        run: bun evidence/tools/route-announcer.ts

      - name: "Q4b5: kitchen counters live (E77) — the house counts its own events"
        run: |
          set -eo pipefail
          mkdir -p evidence/prod-run/house
          # the battery above created bookings/inquiries (and the race created 409s) —
          # the counters must show them; ZERO RUM is enforced by audit:motion (E76)
          curl -s -m 10 http://localhost:3000/api/house -o evidence/prod-run/house/counters.json
          cat evidence/prod-run/house/counters.json
          BOOKINGS=$(bun -e 'const j=await Bun.file("evidence/prod-run/house/counters.json").json();console.log(j.house["bookings.created"])')
          [ "${BOOKINGS:-0}" -ge 1 ] || { echo "E77 FAIL: bookings counter did not move"; exit 1; }
          echo "E77 PASS — kitchen counters live (bookings=${BOOKINGS}, no RUM)"

      - name: "Q4b3: image surface probes (E53/E54) — AVIF served + OG JPEG magic"
        run: |
          set -eo pipefail
          mkdir -p evidence/prod-run/img-surface
          cd evidence/prod-run/img-surface
          # E53: a documented ladder request served content-type: image/avif
          curl -is -m 20 "http://localhost:3000/img/hero/poster-750w.avif?w=640" > ladder-avif.txt
          grep -i "content-type: image/avif" ladder-avif.txt || { echo "E53 FAIL: ladder rung not image/avif"; exit 1; }
          # E53: the optimizer route prefers AVIF (Accept carries avif)
          curl -is -m 30 -H "Accept: image/avif,image/*" "http://localhost:3000/_next/image?url=%2Fimg%2Fgallery%2Ffire-3.avif&w=384&q=75" > optimizer-avif.txt
          grep -i "content-type: image/avif" optimizer-avif.txt || { echo "E53 FAIL: optimizer not serving image/avif"; exit 1; }
          # E54: OG images are JPEG — content-type + magic bytes, both locales
          for loc in en ar; do
            curl -is -m 20 "http://localhost:3000/img/og/og-image-$loc.jpg" > og-$loc-jpeg.txt
            grep -i "content-type: image/jpeg" og-$loc-jpeg.txt || { echo "E54 FAIL: og-$loc not image/jpeg"; exit 1; }
            curl -s -m 20 "http://localhost:3000/img/og/og-image-$loc.jpg" -o og-$loc.jpg
            printf "og-$loc.jpg magic bytes: " | tee magic-$loc.txt
            od -An -tx1 -N3 og-$loc.jpg | tr -d ' \n' | tee -a magic-$loc.txt; echo | tee -a magic-$loc.txt
            grep -q "ffd8ff" magic-$loc.txt || { echo "E54 FAIL: og-$loc magic bytes not JPEG (ffd8ff)"; exit 1; }
          done
          echo "E53/E54 PASS — AVIF served on both surfaces; OG pair is JPEG by content-type + magic bytes"

      - name: "Q1b: P-024 route census ○/● from the build output (E65)"
        run: bun scripts/route-census.ts build-output.log

      - name: "RPL-4: prod-run MANIFEST (E56) — runner OS · pg pin · tool versions"
        run: |
          set -eo pipefail
          mkdir -p evidence/prod-run
          {
            echo "# prod-run MANIFEST (RPL-4/E56) — machine-generated $(date -u +%FT%TZ)"
            echo ""
            echo "- runner: ${RUNNER_NAME:-unknown} @ ${RUNNER_OS:-unknown} (${IMAGE_OS:-image-os unset})"
            echo "- postgres service: postgres:16 (major pin — workflow services block)"
            echo "- DATABASE_URL target: localhost:5432/mirador (service container)"
            echo "- bun: $(bun --version)"
            echo "- node: $(node --version)"
            echo "- prisma CLI: $(bunx prisma --version | head -2 | tr '\n' ' ')"
            echo "- playwright: $(bunx playwright --version)"
            echo "- chromium (PLAYWRIGHT): $(ls /home/runner/.cache/ms-playwright/ | tr '\n' ' ')"
            echo "- lighthouse: @lhci/cli@0.15.1 (pinned in workflow)"
            echo "- repo HEAD: $(git rev-parse HEAD)"
            echo "- actions run: ${GITHUB_RUN_NUMBER} (id ${GITHUB_RUN_ID})"
          } > evidence/prod-run/MANIFEST.md
          cat evidence/prod-run/MANIFEST.md

      - name: "Q4c: 16 rendered snapshots + grep summary (E13 form)"
        run: |
          set -eo pipefail
          mkdir -p evidence/prod-run/snapshots
          CID=$(bun -e 'const{PrismaClient}=require("@prisma/client");const db=new PrismaClient();const r=await db.reservation.findFirst({orderBy:{createdAt:"asc"}});console.log(r.id);await db.$disconnect()')
          echo "seed confirmation id: $CID"
          cd evidence/prod-run/snapshots
          for loc in en ar; do
            for r in "home:" "menu:menu" "reserve:reserve" "story:story" "gallery:gallery" "private-dining:private-dining" "contact:contact" "confirmation:confirmation/$CID"; do
              name="${r%%:*}"; path="${r#*:}"
              curl -s -m 25 -o "$name--$loc.html" "http://localhost:3000/$loc${path:+/$path}"
            done
          done
          { echo "# snapshot grep summary — machine-generated $(date -u +%FT%TZ)";
            echo "# gate (E13): every CONTENT snapshot ≥3 rel=alternate hreflang + ≥1 wa.me/963955000111";
            echo "# gate (E45/COP-2): confirmation snapshots — self-canonical + noindex + ZERO per-id alternates";
            echo "# gate (E71): «يرجى» rendered count = 0 across all snapshots (the term-ledger purge)";
            echo "# run-17 lesson: zero-match greps exit 1 — (grep || true) | wc -l, or the gate that";
            echo "# proves the يرجى purge kills the run the moment the purge WORKS (pipefail).";
            PASS=0; TOTAL=0; YARJO=0; COP2=0
            for f in *.html; do
              alt=$( { grep -o 'rel="alternate"' "$f" || true; } | wc -l )
              wa=$( { grep -o 'wa\.me/963955000111' "$f" || true; } | wc -l )
              yj=$( { grep -o 'يرجى' "$f" || true; } | wc -l ); YARJO=$((YARJO+yj))
              TOTAL=$((TOTAL+1))
              case "$f" in
                confirmation--*)
                  # COP-2 (R5): guest PII demoted — no per-id hreflang, self-canonical, noindex
                  canon=$( { grep -o "rel=\"canonical\"[^>]*confirmation" "$f" || true; } | wc -l )
                  noindex=$( { grep -o 'noindex' "$f" || true; } | wc -l )
                  ok=$([ "$alt" -eq 0 ] && [ "$canon" -ge 1 ] && [ "$noindex" -ge 1 ] && [ "$wa" -ge 1 ] && echo 1 || echo 0)
                  echo "$f COP-2: alternates=$alt canonical=$canon noindex=$noindex wa.me=$wa يرجى=$yj"
                  COP2=$((COP2+ok)) ;;
                *)
                  ok=$([ "$alt" -ge 3 ] && [ "$wa" -ge 1 ] && echo 1 || echo 0)
                  echo "$f alternates=$alt wa.me=$wa يرجى=$yj" ;;
              esac
              PASS=$((PASS+ok))
            done
            echo "SUMMARY: $PASS/$TOTAL PASS · COP-2-confirmation=$COP2/2 · يرجى-rendered=$YARJO"; } > grep-summary.txt
          cat grep-summary.txt
          [ "$(grep -c 'SUMMARY: 16/16 PASS' grep-summary.txt)" = "1" ] || { echo "snapshot grep gate failed"; exit 1; }
          [ "$(grep -o 'COP-2-confirmation=[0-9]*/2' grep-summary.txt)" = "COP-2-confirmation=2/2" ] || { echo "E45 FAIL: confirmation not demoted (COP-2)"; exit 1; }
          [ "$(grep -o 'يرجى-rendered=[0-9]*' grep-summary.txt)" = "يرجى-rendered=0" ] || { echo "E71 FAIL: يرجى still rendered"; exit 1; }

      - name: "Q4d: console ×16 + probes (E24)"
        run: bun evidence/tools/console-probes.ts

      - name: "Q4e: axe ×48 (E25)"
        run: bun evidence/tools/axe-run.ts

      - name: "Q4f: screenshots 57 (E26)"
        run: bun evidence/tools/screenshots.ts

      - name: "Q4g: keyboard walkthroughs"
        run: bun evidence/tools/keyboard.ts

      - name: "Q4h: DOM AC probes (state matrix + §9 battery)"
        run: bun evidence/tools/dom-ac-probes.ts

      - name: "Q4i: Lighthouse CI (E27) — mobile · 3 runs · medians"
        # continue-on-error: LHCI's assert exits 1 on threshold failure — the raw
        # verdicts ship in lhci-run.log + medians.md; verify-battery (final gate)
        # fails the job after ALL evidence is collected and committed.
        continue-on-error: true
        run: |
          set -eo pipefail
          export CHROME_PATH="$(ls /home/runner/.cache/ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -1)"
          echo "CHROME_PATH resolved: ${CHROME_PATH:-NOT-FOUND}"
          [ -n "${CHROME_PATH:-}" ] || { echo "FATAL: chromium binary not found"; exit 1; }
          bunx @lhci/cli@0.15.1 autorun --config=.lighthouserc.json 2>&1 | tee lhci-run.log

      - name: "Q4i: Lighthouse medians + lcpElement (E27/E28) → evidence/prod-run/lighthouse/"
        run: |
          mkdir -p evidence/prod-run/lighthouse
          cp lhci-run.log evidence/prod-run/lighthouse/ 2>/dev/null || true
          bun evidence/tools/lighthouse-summary.ts

      - name: "Q4j: cold-start handoff (F12-3) — fresh clone + migrate + seed + dev"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p evidence/prod-run/cold-start
          pkill -f ".next/standalone/server.js" || true
          sleep 2
          LOG=$(mktemp)
          {
            echo "# cold-start handoff (F12-3) — machine-generated $(date -u +%FT%TZ)"
            echo "# fresh clone of $GITHUB_REPOSITORY → bun install · migrate · seed · dev → GET /en 200"
            rm -rf /tmp/coldstart
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/coldstart
            cd /tmp/coldstart
            echo "clone HEAD: $(git rev-parse HEAD)"
            bun install --frozen-lockfile
            bun run db:generate
            echo 'CREATE DATABASE mirador_coldstart' | bunx prisma db execute --stdin --url postgresql://mirador:mirador@localhost:5432/postgres
            export DATABASE_URL="postgresql://mirador:mirador@localhost:5432/mirador_coldstart"
            # COP-1 (prompt-4 R5): the fresh clone has no .env — the deploy guard
            # fails any next command without NEXT_PUBLIC_SITE_URL. PLACEHOLDER origin.
            export NEXT_PUBLIC_SITE_URL="https://mirador.example"
            bun run migrate
            bun run seed
            nohup bun run dev > /dev/null 2>&1 &
            code=000
            for i in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 http://localhost:3000/en || echo 000)
              [ "$code" = "200" ] && break; sleep 2
            done
            echo "cold-start GET /en → $code"
            curl -s -o /dev/null -w "GET /ar → %{http_code}\n" -m 10 http://localhost:3000/ar
            pkill -f "next dev" || true
            if [ "$code" = "200" ]; then echo "GATE F12-3: PASS — fresh clone boots clean, /en 200"; else echo "GATE F12-3: FAIL — /en → $code"; fi
          } 2>&1 | tee "$LOG"
          cp "$LOG" evidence/prod-run/cold-start/cold-start.log
          cp /tmp/coldstart/dev.log evidence/prod-run/cold-start/dev.log 2>/dev/null || echo "(clone dev.log absent)" >> evidence/prod-run/cold-start/cold-start.log
          grep -q "GATE F12-3: PASS" evidence/prod-run/cold-start/cold-start.log || exit 1

      - name: Capture production server log (raw)
        if: always()
        run: |
          mkdir -p evidence/prod-run
          cp server.log evidence/prod-run/server.log 2>/dev/null || echo "(server.log absent)" > evidence/prod-run/server.log
          tail -40 evidence/prod-run/server.log

      - name: "E33: commit + push the prod-run evidence"
        if: always()
        run: |
          set -o pipefail
          git config user.name "mirador-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p evidence/F12-2/prod-run evidence/F6-3/prod-run
          git add -f evidence/prod-run 2>/dev/null || true
          git add -f evidence/F12-2/prod-run evidence/F6-3/prod-run 2>/dev/null || true
          # Run-14 lesson: the battery regenerates tracked docs (Q2b exchange
          # ledger, Q2-prep copy parity) and raw r1 logs (E57/E59) — leaving
          # them unstaged poisons the pre-push rebase ("unstaged changes").
          # They ARE this run's evidence: stage them with the rest.
          git add -f docs/exchange-ledger.md docs/copy-parity.md 2>/dev/null || true
          git add -f evidence/r1/E57/ledger.log evidence/r1/E59/gatebook-check.log 2>/dev/null || true
          # P5/R1 (E83 · J-3 class, one level deeper): the three audit raws the
          # Q2c/Q2b steps regenerate on every dispatch — unstaged, their cited
          # paths died with the runner and the MATRIX self-check caught the
          # drift. Staged from now on so the citations stay live.
          git add -f evidence/r1/E66/audit-idioms.log evidence/r1/E76/audit-motion.log evidence/r1/E78/audit-twins.log 2>/dev/null || true
          git status --short > /tmp/git-status.txt || true # no pipe: `| head` SIGPIPEs (141) under pipefail when >30 files changed (run-10 lesson)
          head -30 /tmp/git-status.txt
          git commit -m "prod-run evidence battery (prompt-3 Q1–Q4) — actions run ${{ github.run_number }} [surface: prod-run]" || echo "nothing to commit"
          # Run-9 lesson: main can move during a battery (concurrent R-train pushes) —
          # rebase the evidence commit before pushing instead of losing it to non-FF.
          git fetch origin main
          git rebase origin/main || { echo "rebase failed — force-push safety net skipped"; exit 1; }
          git push

      - name: "Battery verdict verification (FINAL exit gate — fails the job when any verdict reads FAIL)"
        run: bash evidence/tools/verify-battery.sh

      - name: Upload evidence artifact (≥90-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-run-evidence-${{ github.run_number }}
          retention-days: 90
          path: |
            evidence/
            build-output.log
            lhci-run.log
            .lighthouseci/
