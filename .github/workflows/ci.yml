# MIRADOR — CI (prompt-4 R1 · C-2): doc-drift guard on every push.
# N24: no doc claim without its raw artifact — verify-docs fails the job when
# a doc assertion contradicts the raw state it names. R7's fences (LEDGER /
# EXCHANGE / GATEBOOK) arm here as they land.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: "E38: verify-docs — doc claims must match their raw artifacts"
        run: |
          set -eo pipefail
          bun scripts/verify-docs.ts --probe
